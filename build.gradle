plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = "${mod_version}-fabric-mc${minecraft_version}"
group = mod_group_id

base {
    archivesName = mod_id
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

sourceSets {
    main {
        resources.srcDir 'src/generated/resources'
    }
}

repositories {
    maven {
        name = 'ParchmentMC'
        url = 'https://maven.parchmentmc.org'
    }
    maven {
        name = 'Terraformers'
        url = 'https://maven.terraformersmc.com/'
    }
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
    }
    maven {
        name = "Jared's Maven"
        url = "https://maven.blamejared.com/"
    }
}

configurations {
    clientRuntimeMods {
        canBeConsumed = false
        canBeResolved = true
        transitive = true
    }
}

tasks.register('cleanClientRuntimeMods', Delete) {
    delete layout.projectDirectory.dir('run/client/mods')
}

tasks.register('syncClientRuntimeMods', Sync) {
    dependsOn tasks.named('cleanClientRuntimeMods')
    from configurations.clientRuntimeMods
    into layout.projectDirectory.dir('run/client/mods')
    include "jei-${minecraft_version}-fabric-${jei_version}.jar"
}

loom {
    runs {
        client {
            client()
            runDir "run/client"
        }
        server {
            server()
            runDir "run/server"
        }
    }
}

fabricApi {
    configureDataGeneration {
        client = true
        outputDirectory = file("src/generated/resources")
    }
}

tasks.register('runData') {
    group = 'Fabric'
    description = 'Runs Fabric data generation.'
    dependsOn tasks.named('runDatagen')
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.layered {
        officialMojangMappings()
        parchment("org.parchmentmc.data:parchment-${parchment_minecraft_version}:${parchment_mappings_version}@zip")
    }
    modImplementation "net.fabricmc:fabric-loader:${loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
    modImplementation "maven.modrinth:fusion-connected-textures:${fusion_version}-fabric-mc${fusion_minecraft_version}"
    modImplementation "com.terraformersmc:modmenu:${modmenu_version}"
    clientRuntimeMods "mezz.jei:jei-${minecraft_version}-fabric:${jei_version}"
}

tasks.named('runClient') {
    dependsOn tasks.named('syncClientRuntimeMods')
}

tasks.named('processResources', ProcessResources).configure {
    inputs.properties([
            mod_id                  : mod_id,
            mod_name                : mod_name,
            mod_license             : mod_license,
            mod_version             : mod_version,
            mod_authors             : mod_authors,
            mod_description         : mod_description,
            minecraft_version       : minecraft_version,
            minecraft_version_range : minecraft_version_range,
            loader_version          : loader_version,
            fabric_api_version      : fabric_api_version,
            fusion_version          : fusion_version,
            modmenu_version         : modmenu_version
    ])

    filesMatching('fabric.mod.json') {
        expand inputs.properties
    }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url = "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
