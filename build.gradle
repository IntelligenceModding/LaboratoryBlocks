plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'idea'
}

import groovy.json.JsonSlurper

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = "${mod_version}-fabric-mc${minecraft_version}"
group = mod_group_id

base {
    archivesName = mod_id
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
}

sourceSets {
    main {
        resources.srcDir 'src/generated/resources'
    }
}

repositories {
    maven {
        name = 'Terraformers'
        url = 'https://maven.terraformersmc.com/'
    }
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
    }
    maven {
        name = "Jared's Maven"
        url = "https://maven.blamejared.com/"
    }
}

configurations {
    clientRuntimeMods {
        canBeConsumed = false
        canBeResolved = true
        transitive = true
    }
}

tasks.register('cleanClientRuntimeMods', Delete) {
    delete layout.projectDirectory.dir('run/client/mods')
}

tasks.register('syncClientRuntimeMods', Sync) {
    dependsOn tasks.named('cleanClientRuntimeMods')
    from configurations.clientRuntimeMods
    into layout.projectDirectory.dir('run/client/mods')
    include "jei-${minecraft_version}-fabric-${jei_version}.jar"
}

loom {
    accessWidenerPath = file("src/main/resources/laboratoryblocks.accesswidener")

    runs {
        client {
            client()
            runDir "run/client"
        }
        server {
            server()
            runDir "run/server"
        }
    }
}

fabricApi {
    configureDataGeneration {
        client = true
        outputDirectory = file("src/generated/resources")
    }
}

def generatedResourcesDir = layout.projectDirectory.dir('src/generated/resources')

tasks.named('runDatagen') {
    outputs.dir(generatedResourcesDir)
}

tasks.register('runData') {
    group = 'Fabric'
    description = 'Runs Fabric data generation.'
    dependsOn tasks.named('runDatagen')
}

tasks.register('verifyGeneratedResources') {
    group = 'verification'
    description = 'Verifies generated data/resource provider outputs required by the mod.'
    dependsOn tasks.named('runData')

    def generatedDir = generatedResourcesDir
    inputs.dir(generatedDir)

    doLast {
        def requiredFiles = [
                'assets/laboratoryblocks/lang/en_us.json',
                'assets/laboratoryblocks/items/laboratory_block.json',
                'assets/laboratoryblocks/blockstates/laboratory_block.json',
                'assets/laboratoryblocks/models/block/laboratory_block.json',
                'assets/laboratoryblocks/textures/block/laboratory_block-fusion.png.mcmeta',
                'data/laboratoryblocks/loot_table/blocks/laboratory_block.json',
                'data/laboratoryblocks/recipe/laboratory_block.json',
                'data/minecraft/tags/block/mineable/pickaxe.json',
                'data/minecraft/tags/item/enchantable/durability.json'
        ]

        requiredFiles.each { path ->
            def file = generatedDir.file(path).asFile
            if (!file.isFile()) {
                throw new GradleException("Missing generated resource: ${path}. Run ./gradlew runData.")
            }
        }

        def langFile = generatedDir.file('assets/laboratoryblocks/lang/en_us.json').asFile
        def lang = new JsonSlurper().parse(langFile)
        [
                'itemGroup.laboratoryblocks',
                'item.laboratoryblocks.configuration_tool',
                'item.laboratoryblocks.iron_screw',
                'item.laboratoryblocks.glowstone_particles',
                'item.laboratoryblocks.laboratory_door',
                'block.laboratoryblocks.laboratory_block',
                'block.laboratoryblocks.pale_oak_laboratory_floor',
                'tooltip.laboratoryblocks.configuration_tool.remove_glowstone'
        ].each { key ->
            if (!lang.containsKey(key)) {
                throw new GradleException("Missing generated language key: ${key}. Run ./gradlew runData.")
            }
        }
    }
}

tasks.named('check') {
    dependsOn tasks.named('verifyGeneratedResources')
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
    implementation "maven.modrinth:fusion-connected-textures:${fusion_version}-fabric-mc${fusion_minecraft_version}"
    runtimeOnly "com.terraformersmc:modmenu:${modmenu_version}"
    clientRuntimeMods "mezz.jei:jei-${minecraft_version}-fabric:${jei_version}"
}

tasks.named('runClient') {
    dependsOn tasks.named('syncClientRuntimeMods')
}

tasks.named('processResources', ProcessResources).configure {
    def replaceProperties = [
            mod_id                  : mod_id,
            mod_name                : mod_name,
            mod_license             : mod_license,
            mod_version             : mod_version,
            mod_authors             : mod_authors,
            mod_description         : mod_description,
            minecraft_version       : minecraft_version,
            minecraft_version_range : minecraft_version_range,
            loader_version          : loader_version,
            loader_version_range    : loader_version_range,
            fabric_api_version      : fabric_api_version,
            fabric_api_version_range: fabric_api_version_range,
            fusion_version          : fusion_version,
            fusion_version_range    : fusion_version_range,
            modmenu_version         : modmenu_version
    ]
    inputs.properties(replaceProperties)

    filesMatching('fabric.mod.json') {
        expand replaceProperties
    }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url = "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
