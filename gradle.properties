# Gradle
org.gradle.jvmargs=-Xmx8G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Minecraft
minecraft_version=26.3
minecraft_version_range=>=26.3 <26.4

# Fabric
loom_version=1.18.2
loader_version=0.20.1
# Minimum required by the 26.3 Fabric API; allow future Loader releases.
loader_version_range=>=0.19.3
fabric_api_version=0.165.0+26.3
# First Fabric API for the final 26.3 release; allow future API releases.
fabric_api_version_range=>=0.160.5
modmenu_version=21.0.0

# Dependencies
fusion_version=1.3.16
fusion_minecraft_version=26.3
fusion_version_range=>=1.3.15
jei_version=31.17.0.94

# Mod properties
mod_id=laboratoryblocks
mod_name=Artemis' Laboratory Blocks
mod_license=MIT License
mod_version=0.8.5
mod_group_id=de.artemis.laboratoryblocks
mod_authors=DoomedArtemis
mod_description=Upgrade your builds with modern, futuristic laboratory blocks inspired by the classic laboratory style.
