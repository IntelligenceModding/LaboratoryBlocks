# Gradle
org.gradle.jvmargs=-Xmx8G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Minecraft
minecraft_version=26.3
minecraft_version_range=[26.3,26.4)

# NeoForge
neo_version=26.3.0.99
# First non-beta 26.3 build; no upper cap on newer NeoForge releases.
neo_version_range=[26.3.0.76,)
loader_version_range=[1,)

# Dependencies
fusion_version=1.3.16
fusion_minecraft_version=26.3
# Fusion's 1.3.15b download declares its mod version as 1.3.15+b.
fusion_version_range=[1.3.15+b,)
jei_version=31.17.0.95

# Mod properties
mod_id=laboratoryblocks
mod_name=Artemis' Laboratory Blocks
mod_license=MIT License
mod_version=0.8.5
mod_group_id=de.artemis.laboratoryblocks
mod_authors=DoomedArtemis
mod_description=Upgrade your builds with modern, futuristic laboratory blocks inspired by the classic laboratory style.
